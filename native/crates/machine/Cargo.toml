[package]
name = "agentos-machine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "agentos-machined"
path = "src/main.rs"

[dependencies]
agentos-protocol = { path = "../protocol", features = ["dbus"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
libc = { workspace = true }
rusqlite = { workspace = true }
zbus = { workspace = true }
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast"] }
getrandom = "0.2"

[[bin]]
name = "agentosctl"
path = "src/ctl.rs"
