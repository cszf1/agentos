[package]
name = "agentos-session-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "agentos-session-gateway"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
agentos-protocol = { path = "../protocol", features = ["dbus"] }
agentos-machine = { path = "../machine" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
libc = { workspace = true }
zbus = { workspace = true }
