[workspace]
resolver = "2"
members = ["crates/protocol", "crates/broker", "crates/provider-user", "crates/provider-workers", "crates/telemetry", "crates/machine", "crates/session-gateway"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
libc = "0.2"
rusqlite = { version = "0.37", features = ["bundled"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
udev = "0.9"

[profile.release]
opt-level = 2
debug = false
panic = "abort"
lto = false
