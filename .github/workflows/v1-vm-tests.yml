# AgentOS v1.0 NixOS VM checks on GitHub-hosted runners (KVM available on ubuntu-latest for public repos).
# One matrix job per VM check; any single check can be re-run with "Run workflow" and test=<name>.
# These runs are "KVM VM" evidence only: not real hardware, display, input method or serial devices.
name: v1-vm-tests

on:
  push:
    branches: [v1.0]
    # review F14: every change except documentation runs the whole set, so the release commit itself is always tested
    # (scripts/, tests/, package.json and the workflow included); docs-only commits do not.
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:
    inputs:
      test:
        description: "VM check to run (all, or one name from the list in the 'plan' job)"
        required: true
        default: all

permissions:
  contents: read

concurrency:
  group: v1-vm-${{ github.ref }}-${{ github.event.inputs.test || 'all' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.pick.outputs.tests }}
    steps:
      - id: pick
        env:
          WANT: ${{ github.event.inputs.test || 'all' }}
        run: |
          ALL='["m2-identity","m3-members","m5-desktop","m6-install","m6-qcow2","m7-update","m8-backup","m9-restore","m10-sched","m11-ops","m12-clone","m13-native","m14-create","m15-wifi","m16-fetch","m17-shared","m18-o09","build-release","build-audit","build-iso","build-qcow2","build-shell","build-oci","build-repro","build-physical"]'
          if [ "$WANT" = all ]; then echo "tests=$ALL" >> "$GITHUB_OUTPUT";
          else echo "$ALL" | jq -e --arg t "$WANT" 'index($t) != null' >/dev/null || { echo "unknown test $WANT"; exit 1; }
               echo "tests=[\"$WANT\"]" >> "$GITHUB_OUTPUT"; fi

  vm:
    needs: plan
    runs-on: ubuntu-latest
    # Each nix step is capped at 110 min (a hung build VM fails the step with its log instead of eating the job).
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.plan.outputs.tests) }}
    steps:
      - uses: actions/checkout@v4
        with:
          # review F16: the history layer of build-audit scans every commit object, so that job needs the full clone
          fetch-depth: ${{ matrix.test == 'build-audit' && '0' || '1' }}

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          if [ "${{ matrix.test }}" = build-repro ]; then
            # two copies of the ISO and the qcow2 plus their closures: run 41141167119 died with "No space left on device"
            sudo rm -rf /usr/local/lib/node_modules /usr/local/.ghcup /usr/share/swift /usr/lib/jvm /opt/microsoft /opt/google \
              /usr/local/share/chromium /usr/local/share/powershell /opt/hostedtoolcache /opt/az /usr/share/miniconda || true
            sudo docker system prune -af >/dev/null 2>&1 || true
          fi
          df -h /

      - name: Enable KVM
        run: |
          echo "AgentOS commit under test: $GITHUB_SHA (ref $GITHUB_REF, event $GITHUB_EVENT_NAME)"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            system-features = nixos-test benchmark big-parallel kvm
            require-sigs = true
            # the Actions cache throttles (HTTP 418) and the cache substituter is then disabled: build locally instead
            fallback = true

      # Path-level binary cache in the GitHub Actions cache, shared and de-duplicated across all matrix jobs.
      # (nix-community/cache-nix-action restored a whole-store tarball into the daemon-owned /nix/store and failed
      # with "Cannot mkdir: Permission denied" on every path, so every run rebuilt from zero.)
      - uses: DeterminateSystems/magic-nix-cache-action@v15
        with:
          use-flakehub: false

      - name: Build test driver
        if: ${{ !startsWith(matrix.test, 'build-') }}
        working-directory: os
        run: |
          set -o pipefail
          set +e
          timeout 110m nix build ".#checks.x86_64-linux.${{ matrix.test }}.driver" -L --print-out-paths 2>&1 | tee "$RUNNER_TEMP/build-${{ matrix.test }}.log" | grep --line-buffered -E '^(vm-test-run|agentos-[a-z0-9-]+>|error|building .*(qcow2|iso|release|vm-test))|!!!'
          rc=${PIPESTATUS[0]}; set -e
          tail -n 150 "$RUNNER_TEMP/build-${{ matrix.test }}.log"
          [ "$rc" = 0 ] || exit "$rc"

      - name: Run VM check (KVM)
        if: ${{ !startsWith(matrix.test, 'build-') }}
        working-directory: os
        run: |
          set -o pipefail
          ls -l /dev/kvm
          set +e
          timeout 110m nix build ".#checks.x86_64-linux.${{ matrix.test }}" -L --print-out-paths 2>&1 | tee "$RUNNER_TEMP/vm-${{ matrix.test }}.log" | grep --line-buffered -E '^(vm-test-run|agentos-[a-z0-9-]+>|error|building .*(qcow2|iso|release|vm-test))|!!!'
          rc=${PIPESTATUS[0]}; set -e
          tail -n 150 "$RUNNER_TEMP/vm-${{ matrix.test }}.log"
          [ "$rc" = 0 ] || exit "$rc"

      - name: Rebuild and compare (O09 part)
        if: ${{ matrix.test == 'build-repro' }}
        working-directory: os
        run: |
          # Build each delivered output, then build it again from the same inputs with --rebuild: Nix fails if the
          # second build differs bit for bit and keeps both copies (<out> and <out>.check) for the diff.
          set -o pipefail
          rc=0
          for A in agentos-native agentos-node agentos-shell agentos-release agentos-oci agentos-iso agentos-qcow2; do
            nix build ".#$A" -L --print-out-paths 2>&1 | tail -3 | tee -a "$RUNNER_TEMP/build-repro.log"
            if nix build ".#$A" --rebuild --keep-failed -L 2>&1 | tail -20 | tee -a "$RUNNER_TEMP/build-repro.log"; then
              echo "REPRO $A identical" | tee -a "$RUNNER_TEMP/build-repro.log"
            else
              out=$(nix eval --raw ".#$A.outPath")
              { [ -e "$out.check" ] && diff -r "$out" "$out.check" 2>&1 | head -60 | tee -a "$RUNNER_TEMP/build-repro.log"; } || true
              if [ "$A" = agentos-qcow2 ] && [ -e "$out.check" ] && nix shell --inputs-from . nixpkgs#qemu-utils nixpkgs#cryptsetup nixpkgs#util-linux nixpkgs#mtools nixpkgs#python3 -c \
                   python3 repro-explain-qcow2.py "$out/agentos.qcow2" "$out.check/agentos.qcow2" 2>&1 | tee -a "$RUNNER_TEMP/build-repro.log"; then
                # the only difference is the LUKS2 partition (fresh volume key/salts/UUID per luksFormat, decision 11)
                echo "REPRO $A DIFFERS-EXPLAINED" | tee -a "$RUNNER_TEMP/build-repro.log"
              else
                echo "REPRO $A DIFFERS" | tee -a "$RUNNER_TEMP/build-repro.log"; rc=1
              fi
            fi
            # the second copy and failed build trees are only needed for the comparison above
            out=$(nix eval --raw ".#$A.outPath"); sudo rm -rf "$out.check" /tmp/nix-build-* /nix/var/nix/builds/* 2>/dev/null || true
            df -h / | tail -1 | tee -a "$RUNNER_TEMP/build-repro.log"
          done
          exit $rc

      - name: Build release output
        if: ${{ startsWith(matrix.test, 'build-') && matrix.test != 'build-repro' }}
        working-directory: os
        env:
          T: ${{ matrix.test }}
        run: |
          set -o pipefail
          A="agentos-${T#build-}"
          set +e
          timeout 110m nix build ".#$A" -L --print-out-paths -o "$RUNNER_TEMP/out-$A" 2>&1 | tee "$RUNNER_TEMP/build-$A.log" | grep --line-buffered -E '^(vm-test-run|agentos-[a-z0-9-]+>|error|building .*(qcow2|iso|release|vm-test))|!!!'
          rc=${PIPESTATUS[0]}; set -e
          tail -n 150 "$RUNNER_TEMP/build-$A.log"
          [ "$rc" = 0 ] || exit "$rc"
          ls -laR "$RUNNER_TEMP"/out-$A* | head -50 | tee -a "$RUNNER_TEMP/build-$A.log"
          if [ "$A" = agentos-release ]; then
            cp "$RUNNER_TEMP/out-$A"/*.json "$RUNNER_TEMP/out-$A"/SHA256SUMS "$RUNNER_TEMP/"
            # review R2-5: releaseSequence allocation check (commit time, explicit value, monotonic against the previous)
            nix build .#checks.x86_64-linux.release-sequence -L 2>&1 | tail -20 | tee -a "$RUNNER_TEMP/build-$A.log"
            jq .releaseSequence "$RUNNER_TEMP/out-$A/manifest.json" | tee -a "$RUNNER_TEMP/build-$A.log"
          fi
          echo "commit $GITHUB_SHA" | tee -a "$RUNNER_TEMP/build-$A.log"
          find -L "$RUNNER_TEMP"/out-$A* -maxdepth 3 -type f \( -name '*.iso' -o -name '*.qcow2' \) -exec sha256sum {} \; | tee -a "$RUNNER_TEMP/build-$A.log"

      - name: Layered release audit (review F16)
        if: ${{ matrix.test == 'build-audit' }}
        run: |
          set -o pipefail
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*' || true
          REL=$(cd os && nix build .#agentos-release --print-out-paths --no-link)
          NIXPKGS_ALLOW_INSECURE=1 nix shell --impure nixpkgs#gitleaks nixpkgs#cargo-audit nixpkgs#pnpm nixpkgs#nodejs_24 nixpkgs#jq nixpkgs#openssl --inputs-from ./os -c \
            bash os/audit-layers.sh "$RUNNER_TEMP/out-agentos-audit" "$REL" "$RUNNER_TEMP/audit" 2>&1 | tee "$RUNNER_TEMP/audit-layers.log"
          rc=${PIPESTATUS[0]}
          cp "$RUNNER_TEMP"/audit/*.json "$RUNNER_TEMP/" || true
          echo "commit $GITHUB_SHA" | tee -a "$RUNNER_TEMP/audit-layers.log"
          exit $rc

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vm-${{ matrix.test }}-logs
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/*.json
            ${{ runner.temp }}/SHA256SUMS
          retention-days: 14
