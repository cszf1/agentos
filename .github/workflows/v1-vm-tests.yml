# AgentOS v1.0 NixOS VM checks on GitHub-hosted runners (KVM available on ubuntu-latest for public repos).
# One matrix job per VM check; any single check can be re-run with "Run workflow" and test=<name>.
# These runs are "KVM VM" evidence only: not real hardware, display, input method or serial devices.
name: v1-vm-tests

on:
  push:
    branches: [v1.0]
    paths: ["os/**", "native/**", "packages/**", "desktop/**", "runtime/**", "fixtures/**", "pnpm-lock.yaml", ".github/workflows/v1-vm-tests.yml"]
  workflow_dispatch:
    inputs:
      test:
        description: "VM check to run (all, or one name from the list in the 'plan' job)"
        required: true
        default: all

permissions:
  contents: read

concurrency:
  group: v1-vm-${{ github.ref }}-${{ github.event.inputs.test || 'all' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.pick.outputs.tests }}
    steps:
      - id: pick
        env:
          WANT: ${{ github.event.inputs.test || 'all' }}
        run: |
          ALL='["m2-identity","m3-members","m5-desktop","m6-install","m6-qcow2","m7-update","m8-backup","m9-restore","m10-sched","build-release","build-iso","build-qcow2","build-shell","build-oci"]'
          if [ "$WANT" = all ]; then echo "tests=$ALL" >> "$GITHUB_OUTPUT";
          else echo "$ALL" | jq -e --arg t "$WANT" 'index($t) != null' >/dev/null || { echo "unknown test $WANT"; exit 1; }
               echo "tests=[\"$WANT\"]" >> "$GITHUB_OUTPUT"; fi

  vm:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.plan.outputs.tests) }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            system-features = nixos-test benchmark big-parallel kvm
            require-sigs = true

      # Path-level binary cache in the GitHub Actions cache, shared and de-duplicated across all matrix jobs.
      # (nix-community/cache-nix-action restored a whole-store tarball into the daemon-owned /nix/store and failed
      # with "Cannot mkdir: Permission denied" on every path, so every run rebuilt from zero.)
      - uses: DeterminateSystems/magic-nix-cache-action@v15
        with:
          use-flakehub: false

      - name: Build test driver
        if: ${{ !startsWith(matrix.test, 'build-') }}
        working-directory: os
        run: |
          set -o pipefail
          nix build ".#checks.x86_64-linux.${{ matrix.test }}.driver" -L --print-out-paths 2>&1 | tee "$RUNNER_TEMP/build-${{ matrix.test }}.log"

      - name: Run VM check (KVM)
        if: ${{ !startsWith(matrix.test, 'build-') }}
        working-directory: os
        run: |
          set -o pipefail
          ls -l /dev/kvm
          nix build ".#checks.x86_64-linux.${{ matrix.test }}" -L --print-out-paths 2>&1 | tee "$RUNNER_TEMP/vm-${{ matrix.test }}.log"

      - name: Build release output
        if: ${{ startsWith(matrix.test, 'build-') }}
        working-directory: os
        env:
          T: ${{ matrix.test }}
        run: |
          set -o pipefail
          A="agentos-${T#build-}"
          nix build ".#$A" -L --print-out-paths -o "$RUNNER_TEMP/out-$A" 2>&1 | tee "$RUNNER_TEMP/build-$A.log"
          ls -laR "$RUNNER_TEMP"/out-$A* | head -50 | tee -a "$RUNNER_TEMP/build-$A.log"
          if [ "$A" = agentos-release ]; then cp "$RUNNER_TEMP/out-$A"/*.json "$RUNNER_TEMP/out-$A"/SHA256SUMS "$RUNNER_TEMP/" ; fi
          find -L "$RUNNER_TEMP"/out-$A* -maxdepth 3 -type f \( -name '*.iso' -o -name '*.qcow2' \) -exec sha256sum {} \; | tee -a "$RUNNER_TEMP/build-$A.log"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vm-${{ matrix.test }}-logs
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/*.json
            ${{ runner.temp }}/SHA256SUMS
          retention-days: 14
